        versionCode = 5
        versionName = "0.2.3"
    }

    // Pinned debug keystore, committed in the repo. CI runners generate a
    // fresh debug key on every run, so without this each build would have
    // a different signature and Android would refuse to install it as an
    // update (the user would have to uninstall first, every time).
    // This is the standard Android debug identity (password "android",
    // public knowledge, nothing secret) — the same fix used for Movaldem.
    // The Phase 1 test APK was signed with a one-off CI key, so the user
    // must uninstall that test build once before installing 0.2.0.
    signingConfigs {
        create("pinned") {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.getByName("pinned")
        }
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // ZXing core only: pure Java QR decoding, no Google Play services,
